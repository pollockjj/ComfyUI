[project]
name = "comfyui-geometrypack"
version = "0.1.0"
description = "GeometryPack main nodes — sealed worker isolation"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy>=1.7.0",
    "tqdm>=4.60.0",
    "requests>=2.25.0",
    "trimesh[easy]>=4.0.0",
    "libigl>=2.6.1",
    "pymeshlab>=2025.7",
    "rtree",
    "point-cloud-utils>=0.30.0",
    "mesh-to-sdf>=0.0.14",
    "fast-simplification>=0.1.5",
    "pymeshfix>=0.17.0",
    "xatlas>=0.0.11",
    "skeletor>=1.2.0",
    "pynanoinstantmeshes",
    "pyquadriflow @ https://github.com/PozzettiAndrea/pyQuadriFlow/releases/download/v0.0.6/pyquadriflow-0.0.6-py3-none-any.whl",
    "matplotlib>=3.5.0",
    "pillow>=9.0.0",
    "pyvista>=0.43.0",
    "embreex",
]

[tool.setuptools]
packages = []

[tool.comfy]
PublisherId = "pollockjj"
DisplayName = "GeometryPack"
Icon = ""

[tool.comfy.isolation]
can_isolate = true
package_manager = "conda"
share_torch = false
conda_channels = ["conda-forge"]
conda_dependencies = ["cgal"]
conda_python = "3.12.*"
sandbox_mode = "disabled"
