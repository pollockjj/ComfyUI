[project]
name = "comfyui-geometrypackblender"
version = "0.1.0"
description = "GeometryPack Blender nodes — sealed worker isolation, Python 3.11"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "trimesh[easy]",
    "bpy>=4.2",
    "pillow",
]

[tool.setuptools]
packages = []

[tool.comfy]
PublisherId = "pollockjj"
DisplayName = "GeometryPackBlender"
Icon = ""

[tool.comfy.isolation]
can_isolate = true
package_manager = "conda"
share_torch = false
conda_channels = ["conda-forge"]
conda_dependencies = []
conda_python = "3.11.*"
sandbox_mode = "disabled"
